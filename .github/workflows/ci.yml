name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflows-policy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0

  fmt:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .

  lint:
    permissions:
      contents: read
      pull-requests: read # scan-fix(permissions-mirror): go-lint.yml needs this for golangci-lint-action
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .

  build:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-build.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .

  test:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      id-token: write # scan-fix(permissions-mirror): go-test.yml needs this for L2 S3 cache OIDC
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .

  coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .
      coverage-threshold: 75

  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      working-directory: .
      coverage-threshold: 75

  # Validates all task YAML configs parse and have required fields.
  # This catches malformed tasks before they reach production.
  tasks-validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15
    name: Validate task configs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - run: ./bin/standardizer tasks validate
