version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet          # go vet (shadowed vars, printf mismatches, etc.)
    - errcheck       # unchecked errors
    - staticcheck    # staticcheck suite (SA*, ST*, QF*, S*)
    - ineffassign    # assignments with no effect
    - unused         # unexported symbols that are never used

    # Style
    - misspell       # common English misspellings

    # Security
    - gosec          # G-code security rules (hardcoded credentials, path traversal, etc.)

    # Bugs
    - bodyclose      # HTTP response body must be closed
    - noctx          # HTTP requests must carry context
    - copyloopvar    # loop variable capture bugs

    # Maintainability
    - godot          # comments must end in a period
    - nolintlint     # nolint directives must be specific and justified
  settings:
    govet:
      enable:
        - copylocks
    errcheck:
      check-type-assertions: true
      check-blank: false  # `_ = expr` is intentional in tests
    godot:
      scope: declarations
      capital: false
    # scan-fix(gosec:G304,G204): documented, repo-wide exclude for a systemic
    # false-positive pattern (7 findings across 5 files as of the
    # internal/output rebuild that surfaced them) rather than scattering
    # inline #nosec comments:
    #   - G304 (potential file inclusion via variable) fires on every
    #     os.ReadFile/os.WriteFile call whose path is a variable
    #     (internal/config/repos.go, internal/config/task.go,
    #     internal/tmpl/render.go). Every instance is either an operator-
    #     supplied CLI flag (--repos-config, task file paths discovered by
    #     scanning tasks/*.yaml) or a path this process itself builds
    #     (filepath.Join(repoDir, "AGENTS.md") in internal/output/pr.go) —
    #     never untrusted network/remote input.
    #   - G204 (subprocess launched with variable/tainted input) fires on
    #     exec.Command("git", args...) call sites in internal/context/git.go
    #     and internal/output/pr.go. In every case args is an internally-built
    #     argv slice — never a shell string (no `sh -c`) — so there is no
    #     shell-interpolation / command-injection vector for gosec to actually
    #     be flagging. internal/context/git.go's Clone additionally validates
    #     repoURL against an allowlist regex before it ever reaches exec.
    gosec:
      excludes:
        - G304
        - G204
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck, gosec]
      - path: "vendor/"
        linters: [all]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ffreis

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
